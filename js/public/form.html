<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Support</title>
    <style>
      html, body { height: 100%; margin: 0; background: #eef1f4; }
      @media (prefers-color-scheme: dark) { html, body { background: #0f1214; } }
      #form {
        max-width: 900px;
        min-height: 100%;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) { #form { background: #16191c; } }
    </style>
  </head>
  <body>
    <!-- Страница, которую игра открывает в системном браузере: /form#token=… -->
    <div id="form"></div>
    <script src="/sdk/v1/support_gate.js"></script>
    <script>
      SupportGate.hosted(document.getElementById('form'));
    </script>
  </body>
</html>
